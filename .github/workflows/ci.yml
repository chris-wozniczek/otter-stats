name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - run: swift --version
      - run: swift build
      - run: swift test
      - run: ARCHS=arm64 Scripts/build-app.sh
